name: Deploy Xe Ghep Production

on:
  push:
    branches:
      - master

  workflow_dispatch:

concurrency:
  group: deploy-xeghep-production
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Deploy Xe Ghep PROD
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Configure VPS host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan \
            -p 22 \
            -H 157.66.100.68 \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy Xe Ghep to production
        env:
          PROD_PASS: ${{ secrets.PROD_SSH_PASSWORD }}
        run: |
          sshpass -p "$PROD_PASS" ssh \
            -p 22 \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            root@157.66.100.68 \
            'bash -se' <<'EOF'

          set -Eeuo pipefail

          PROJECT_DIR="/root/quanly-xeghep"
          BRANCH="master"
          COMPOSE_FILE="docker-compose.prod.yml"
          ENV_FILE=".env.prod"

          echo "========================================"
          echo "DEPLOY QUAN LY XE GHEP"
          echo "========================================"

          cd "$PROJECT_DIR"

          echo "==> Lấy source mới nhất"
          git fetch --prune origin "$BRANCH"

          if git show-ref --verify --quiet "refs/heads/$BRANCH"; then
            git checkout "$BRANCH"
          else
            git checkout -b "$BRANCH" "origin/$BRANCH"
          fi

          git reset --hard "origin/$BRANCH"

          echo "==> Kiểm tra file production"
          test -f "$ENV_FILE" || {
            echo "Không tìm thấy $PROJECT_DIR/$ENV_FILE"
            exit 1
          }

          test -f "$COMPOSE_FILE" || {
            echo "Không tìm thấy $PROJECT_DIR/$COMPOSE_FILE"
            exit 1
          }

          echo "==> Kiểm tra shared database network"
          docker network inspect shared-database-network-prod \
            >/dev/null 2>&1 \
            || docker network create shared-database-network-prod

          echo "==> Kiểm tra Docker Compose"
          docker compose \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            config >/dev/null

          echo "==> Build và chạy container"
          docker compose \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            up -d --build --remove-orphans

          echo "==> Chờ ứng dụng khởi động"
          sleep 15

          echo "==> Kiểm tra container"

          for CONTAINER in \
            quanly-xegh-postgres-prod \
            quanly-xegh-redis-prod \
            quanly-xegh-be-prod \
            quanly-xegh-admin-prod \
            quanly-xegh-customer-web-prod \
            quanly-xegh-driver-web-prod
          do
            RUNNING="$(docker inspect \
              --format='{{.State.Running}}' \
              "$CONTAINER" 2>/dev/null || echo false)"

            if [ "$RUNNING" != "true" ]; then
              echo "Container $CONTAINER không chạy."
              docker logs --tail=150 "$CONTAINER" || true
              exit 1
            fi
          done

          echo "==> Trạng thái container"
          docker compose \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            ps

          echo "==> Xóa image dangling"
          docker image prune -f

          echo "========================================"
          echo "DEPLOY XE GHEP THÀNH CÔNG"
          echo "========================================"
          EOF
