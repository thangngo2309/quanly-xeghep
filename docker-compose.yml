services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: quanly-xegh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - quanly_xegh_postgres_data:/var/lib/postgresql/data
    networks:
      - quanly-xegh-network

  redis:
    image: redis:7-alpine
    container_name: quanly-xegh-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - quanly_xegh_redis_data:/data
    networks:
      - quanly-xegh-network

  be:
    container_name: quanly-xegh-be
    build:
      context: ./be
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BE_PORT}:${BE_PORT}"
    volumes:
      - ./be:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - quanly-xegh-network

  admin:
    container_name: quanly-xegh-admin
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${ADMIN_PORT}:${ADMIN_PORT}"
    volumes:
      - ./admin:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - be
    networks:
      - quanly-xegh-network

volumes:
  quanly_xegh_postgres_data:
  quanly_xegh_redis_data:

networks:
  quanly-xegh-network:
    driver: bridge