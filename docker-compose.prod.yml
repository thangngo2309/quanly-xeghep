services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: quanly-xegh-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - quanly_xegh_postgres_prod_data:/var/lib/postgresql/data
    networks:
      - quanly-xegh-network-prod

  redis:
    image: redis:7-alpine
    container_name: quanly-xegh-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - quanly_xegh_redis_data:/data
    networks:
      - quanly-xegh-network

  be:
    container_name: quanly-xegh-be-prod
    build:
      context: ./be
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "${BE_PORT}:${BE_PORT}"
    depends_on:
      - postgres
      - redis
    networks:
      - quanly-xegh-network-prod

  admin:
    container_name: quanly-xegh-admin-prod
    build:
      context: ./admin
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "${ADMIN_PORT}:${ADMIN_PORT}"
    depends_on:
      - be
    networks:
      - quanly-xegh-network-prod
  customer-web:
    container_name: quanly-xegh-customer-web-prod
    build:
      context: ./customer-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
        NEXT_PUBLIC_COMPANY_ID: ${NEXT_PUBLIC_COMPANY_ID}
        NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
      NEXT_PUBLIC_COMPANY_ID: ${NEXT_PUBLIC_COMPANY_ID}
      NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME}
    ports:
      - "${CUSTOMER_WEB_PORT}:${CUSTOMER_WEB_PORT}"
    depends_on:
      - be
    networks:
      - quanly-xegh-network-prod

  driver-web:
    container_name: quanly-xegh-driver-web-prod
    build:
      context: ./driver-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "${DRIVER_WEB_PORT}:${DRIVER_WEB_PORT}"
    depends_on:
      - be
    networks:
      - quanly-xegh-network-prod
      
volumes:
  quanly_xegh_postgres_prod_data:
  quanly_xegh_redis_prod_data:

networks:
  quanly-xegh-network-prod:
    driver: bridge